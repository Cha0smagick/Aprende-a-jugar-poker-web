# Dependabot configuration for automated dependency updates

version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps): "
      prefix-development: "chore(deps-dev): "
    groups:
      development-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier*"
          - "@typescript-eslint/*"
          - "vitest"
          - "@playwright/test"
          - "happy-dom"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "astro"
          - "vue"
          - "pinia"
          - "tailwindcss"
          - "chart.js"
          - "d3"
          - "katex"
          - "zod"
        update-types:
          - "minor"
          - "patch"
      major-updates:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      - dependency-name: "uuid"
        versions: [">= 10.0.0"]
      - dependency-name: "eslint"
        versions: [">= 9.0.0"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    labels:
      - "dependencies"
      - "github-actions"