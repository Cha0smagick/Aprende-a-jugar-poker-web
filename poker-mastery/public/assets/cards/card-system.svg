<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 450" width="320" height="450">
  <defs>
    <!-- Gradientes para cartas -->
    <linearGradient id="cardFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardBackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F5132;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A3D26;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A843;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8C56D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4A843;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C0392B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E74C3C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D2D2D;stop-opacity:1" />
    </linearGradient>

    <!-- Patrón de fondo para dorso -->
    <pattern id="backPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="url(#cardBackGrad)"/>
      <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.3"/>
      <circle cx="20" cy="20" r="8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4"/>
    </pattern>

    <!-- Sombras -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="cardShadowHover" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#D4A843" flood-opacity="0.6" result="glow"/>
      <feComposite in="glow" in2="blur" operator="in" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>

    <!-- Símbolos de palos -->
    <symbol id="spade" viewBox="0 0 100 100">
      <path d="M50 5 C25 5 5 25 5 50 c0 15 10 28 23 33 2 1 4 0 5 -2 2 -3 8 -10 12 -12 3 -1 6 1 7 3 1 3 -2 6 -3 7 -4 2 -10 9 -12 12 -1 2 1 4 3 5 13 -5 23 -18 23 -33 C95 25 75 5 50 5 Z M50 15 C70 15 85 30 85 50 C85 65 73 78 55 87 C52 88 50 91 50 91 S48 88 45 87 C27 78 15 65 15 50 C15 30 30 15 50 15 Z" fill="currentColor"/>
    </symbol>
    <symbol id="heart" viewBox="0 0 100 100">
      <path d="M50 88 C30 88 15 73 15 50 C15 30 30 15 50 15 C58 15 65 20 70 28 C75 20 82 15 90 15 C110 15 125 30 125 50 C125 73 110 88 90 88 C70 88 58 82 50 88 Z M50 88 C50 88 42 82 40 78" fill="currentColor"/>
    </symbol>
    <symbol id="diamond" viewBox="0 0 100 100">
      <path d="M50 5 L95 50 L50 95 L5 50 Z" fill="currentColor"/>
    </symbol>
    <symbol id="club" viewBox="0 0 100 100">
      <path d="M50 10 C30 10 15 25 15 45 C15 55 22 62 30 68 C28 72 25 78 25 85 C25 92 30 97 38 97 C42 97 46 94 48 90 C48 90 48 85 52 85 C54 89 58 92 62 92 C66 92 70 89 72 85 C72 85 72 90 72 90 C74 94 78 97 82 97 C90 97 95 92 95 85 C95 78 92 72 90 68 C98 62 105 55 105 45 C105 25 90 10 70 10 C60 10 53 13 50 18 C47 13 40 10 30 10 Z" fill="currentColor"/>
    </symbol>

    <!-- Máscara para esquina redondeada -->
    <clipPath id="roundedCorner">
      <rect x="0" y="0" width="320" height="450" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Template base - se usará via JavaScript -->
  <g id="cardTemplate" clip-path="url(#roundedCorner)">
    <!-- Fondo carta -->
    <rect x="0" y="0" width="320" height="450" rx="16" ry="16" fill="url(#cardFrontGrad)" stroke="#ddd" stroke-width="2"/>
    
    <!-- Esquina superior izquierda -->
    <g id="cornerTL" transform="translate(16, 16)">
      <text id="rankTL" x="0" y="32" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="currentColor" text-anchor="start"></text>
      <use id="suitTL" href="#spade" x="2" y="36" width="28" height="28"/>
    </g>
    
    <!-- Esquina inferior derecha (rotada 180°) -->
    <g id="cornerBR" transform="translate(304, 434) rotate(180)">
      <text id="rankBR" x="0" y="32" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="currentColor" text-anchor="start"></text>
      <use id="suitBR" href="#spade" x="2" y="36" width="28" height="28"/>
    </g>
    
    <!-- Símbolo central grande -->
    <use id="centerSuit" href="#spade" x="110" y="150" width="100" height="100" opacity="0.15"/>
    
    <!-- Índice central para cartas numéricas (2-10) -->
    <g id="pipsContainer" transform="translate(160, 225)">
      <!-- Los pips se generan dinámicamente -->
    </g>
  </g>

  <!-- Dorso de carta -->
  <g id="cardBack" clip-path="url(#roundedCorner)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="320" height="450" rx="16" ry="16" fill="url(#cardBackGrad)"/>
    <rect x="0" y="0" width="320" height="450" rx="16" ry="16" fill="url(#backPattern)"/>
    <!-- Logo central -->
    <circle cx="160" cy="225" r="50" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.5"/>
    <text x="160" y="235" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" opacity="0.6">♠</text>
    <text x="160" y="285" font-family="Georgia, serif" font-size="24" fill="url(#goldGrad)" text-anchor="middle" opacity="0.4">POKER MASTERY</text>
  </g>
</svg>